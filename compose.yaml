name: go-wagering-service

services:
  app:
    build:
      context: .
      target: runtime
    image: go-wagering-service:local
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      HTTP_ADDR: "0.0.0.0:8080"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      DATABASE_URL: "postgres://wagering_app:wagering_app_local@postgres:5432/wagering?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 20s

  postgres:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_DB: wagering
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_ADMIN_PASSWORD:-postgres_local}"
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=trust"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/001-bootstrap.sql:/docker-entrypoint-initdb.d/001-bootstrap.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wagering"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    stop_grace_period: 30s

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD:-admin_local}"
      KC_DB: dev-file
      KC_HOSTNAME: "http://localhost:8081"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ./deploy/keycloak/wagering-realm.json:/opt/keycloak/data/import/wagering-realm.json:ro
    healthcheck:
      test:
        - CMD
        - /bin/bash
        - -ec
        - >-
          { printf 'HEAD /health/ready HTTP/1.0\r\n\r\n' >&0;
          grep -q 'HTTP/1.0 200'; } 0<>/dev/tcp/localhost/9000
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s
    stop_grace_period: 30s

  tests:
    profiles: ["testing"]
    build:
      context: .
      target: test
    image: go-wagering-service:test
    environment:
      DATABASE_URL: "postgres://wagering_app:wagering_app_local@postgres:5432/wagering?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: