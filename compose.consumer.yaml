services:
  ingress-init:
    profiles: ["consumer"]
    image: ministackorg/ministack:1.5.21
    entrypoint: ["python", "/scripts/ingress_credentials.py"]
    environment:
      AWS_ACCESS_KEY_ID: "${SQS_ADMIN_ACCESS_KEY_ID:-test}"
      AWS_SECRET_ACCESS_KEY: "${SQS_ADMIN_SECRET_ACCESS_KEY:-sqs_admin_local}"
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: "http://ministack:4566"
      AWS_EC2_METADATA_DISABLED: "true"
    volumes:
      - ./deploy/sqs:/scripts:ro
      - consumer_credentials:/consumer_credentials
      - producer_credentials:/producer_credentials
    depends_on:
      sqs-init:
        condition: service_completed_successfully
    restart: "no"

  consumer:
    profiles: ["consumer"]
    build:
      context: .
      dockerfile: Dockerfile.consumer
    image: go-wagering-service:consumer
    environment:
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      DATABASE_URL: "postgres://wagering_app:wagering_app_local@postgres:5432/wagering?sslmode=disable"
      AWS_REGION: us-east-1
      SQS_ENDPOINT: "http://ministack:4566"
      SQS_INPUT_QUEUE_URL: "http://ministack:4566/000000000000/wager-transactions.fifo"
      SQS_CONSUMER_CREDENTIALS_FILE: /credentials/consumer.json
      SQS_ALLOWED_PROVIDERS: "provider-a,provider-b"
    volumes:
      - consumer_credentials:/credentials:ro
    depends_on:
      postgres:
        condition: service_healthy
      ingress-init:
        condition: service_completed_successfully
    stop_grace_period: 20s
    restart: unless-stopped

  consumer-tests:
    profiles: ["consumer-testing"]
    build:
      context: .
      target: test
    environment:
      FINANCE_TEST_MIGRATION_URL: "postgres://wagering_migrator:wagering_migrator_local@finance-postgres:5432/wagering?sslmode=disable"
      FINANCE_TEST_DATABASE_URL: "postgres://wagering_app:wagering_app_local@finance-postgres:5432/wagering?sslmode=disable"
    command: ["go", "test", "-tags=financialintegration,inboxintegration", "-race", "-count=1", "./internal/adapters/postgres/finance"]
    depends_on:
      finance-postgres:
        condition: service_healthy

  consumer-smoke:
    profiles: ["consumer"]
    image: ministackorg/ministack:1.5.21
    entrypoint: ["python", "/scripts/smoke_consumer.py"]
    environment:
      AWS_ACCESS_KEY_ID: "${SQS_ADMIN_ACCESS_KEY_ID:-test}"
      AWS_SECRET_ACCESS_KEY: "${SQS_ADMIN_SECRET_ACCESS_KEY:-sqs_admin_local}"
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: "http://ministack:4566"
      AWS_EC2_METADATA_DISABLED: "true"
      API_BASE_URL: "http://app:8080"
      KEYCLOAK_TOKEN_URL: "http://keycloak:8080/realms/wagering/protocol/openid-connect/token"
      WALLET_CLIENT_SECRET: "${WALLET_CLIENT_SECRET:-wallet-service-local-secret}"
      PROVIDER_A_CLIENT_SECRET: "${PROVIDER_A_CLIENT_SECRET:-provider-a-local-secret}"
    volumes:
      - ./deploy/sqs:/scripts:ro
      - producer_credentials:/credentials:ro
    depends_on:
      consumer:
        condition: service_started
      app:
        condition: service_started

volumes:
  consumer_credentials:
  producer_credentials:
