# Include compose.yaml; include compose.finance.yaml for the isolated tests.
services:
  publisher-init:
    profiles: ["workers", "worker-testing"]
    image: ministackorg/ministack:1.5.21
    entrypoint: ["python", "/scripts/publisher_credentials.py"]
    environment:
      AWS_ACCESS_KEY_ID: "${SQS_ADMIN_ACCESS_KEY_ID:-test}"
      AWS_SECRET_ACCESS_KEY: "${SQS_ADMIN_SECRET_ACCESS_KEY:-sqs_admin_local}"
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: "http://ministack:4566"
      AWS_EC2_METADATA_DISABLED: "true"
    volumes:
      - ./deploy/sqs:/scripts:ro
      - publisher_credentials:/credentials
    depends_on:
      sqs-init:
        condition: service_completed_successfully
    restart: "no"

  workers:
    profiles: ["workers"]
    build:
      context: .
      dockerfile: Dockerfile.workers
      target: runtime
    image: go-wagering-service:workers
    environment:
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      DATABASE_URL: "postgres://wagering_app:wagering_app_local@postgres:5432/wagering?sslmode=disable"
      AWS_REGION: us-east-1
      SQS_ENDPOINT: "http://ministack:4566"
      SQS_EVENTS_QUEUE_URL: "http://ministack:4566/000000000000/wager-events.fifo"
      SQS_PUBLISHER_CREDENTIALS_FILE: /credentials/publisher.json
      WORKER_POLL_INTERVAL: "500ms"
      WORKER_LEASE: "30s"
      WORKER_OPERATION_TIMEOUT: "10s"
      WORKER_RETRY_BASE: "1s"
      WORKER_RETRY_CAP: "60s"
      REFERENCE_TTL: "15m"
    volumes:
      - publisher_credentials:/credentials:ro
    depends_on:
      postgres:
        condition: service_healthy
      publisher-init:
        condition: service_completed_successfully
    stop_grace_period: 20s
    restart: unless-stopped

  worker-tests:
    profiles: ["worker-testing"]
    build:
      context: .
      target: test
    environment:
      FINANCE_TEST_MIGRATION_URL: "postgres://wagering_migrator:wagering_migrator_local@finance-postgres:5432/wagering?sslmode=disable"
      FINANCE_TEST_DATABASE_URL: "postgres://wagering_app:wagering_app_local@finance-postgres:5432/wagering?sslmode=disable"
      AWS_REGION: us-east-1
      SQS_ENDPOINT: "http://ministack:4566"
      SQS_EVENTS_QUEUE_URL: "http://ministack:4566/000000000000/wager-events.fifo"
      SQS_PUBLISHER_CREDENTIALS_FILE: /credentials/publisher.json
    volumes:
      - publisher_credentials:/credentials:ro
    command: ["go", "test", "-tags=financialintegration,workerintegration", "-race", "-count=1", "./internal/adapters/postgres/finance"]
    depends_on:
      finance-postgres:
        condition: service_healthy
      publisher-init:
        condition: service_completed_successfully

volumes:
  publisher_credentials:
