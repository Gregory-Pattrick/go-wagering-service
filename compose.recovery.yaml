# Standalone test project. Requires compose.distributed.yaml for inherited services.
name: wagering-recovery
services:
  postgres:
    extends:
      file: compose.distributed.yaml
      service: postgres
  keycloak:
    extends:
      file: compose.distributed.yaml
      service: keycloak
  ministack:
    extends:
      file: compose.distributed.yaml
      service: ministack
  sqs-init:
    extends:
      file: compose.distributed.yaml
      service: sqs-init
  migrate:
    extends:
      file: compose.distributed.yaml
      service: migrate
  publisher-init:
    extends:
      file: compose.distributed.yaml
      service: publisher-init
  ingress-init:
    extends:
      file: compose.distributed.yaml
      service: ingress-init
  api-1:
    extends:
      file: compose.distributed.yaml
      service: api-1
  fault-before:
    build:
      context: .
      dockerfile: Dockerfile.recovery
    image: go-wagering-service:recovery-race
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgres://wagering_app:wagering_app_local@postgres:5432/wagering?sslmode=disable
      AWS_REGION: us-east-1
      SQS_ENDPOINT: http://ministack:4566
      SQS_EVENTS_QUEUE_URL: http://ministack:4566/000000000000/wager-events.fifo
      SQS_PUBLISHER_CREDENTIALS_FILE: /credentials/publisher.json
      WORKER_POLL_INTERVAL: 500ms
      WORKER_LEASE: 30s
      WORKER_OPERATION_TIMEOUT: 10s
      WORKER_RETRY_BASE: 1s
      WORKER_RETRY_CAP: 60s
      REFERENCE_TTL: 15m
      OBSERVABILITY_ENABLED: 'false'
      GORACE: halt_on_error=1 exitcode=66
      PROBE_DIRECTORY: /control/current
      PROBE_INSTANCE: fault
      PROBE_POINT: before-send
      PROBE_ROLE: publisher
    volumes:
    - publisher_credentials:/credentials:ro
    - recovery_control:/control
    depends_on:
      postgres:
        condition: service_healthy
      publisher-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 20s
    restart: 'no'
    entrypoint:
    - /out/crashprobe
  fault-after:
    build:
      context: .
      dockerfile: Dockerfile.recovery
    image: go-wagering-service:recovery-race
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgres://wagering_app:wagering_app_local@postgres:5432/wagering?sslmode=disable
      AWS_REGION: us-east-1
      SQS_ENDPOINT: http://ministack:4566
      SQS_EVENTS_QUEUE_URL: http://ministack:4566/000000000000/wager-events.fifo
      SQS_PUBLISHER_CREDENTIALS_FILE: /credentials/publisher.json
      WORKER_POLL_INTERVAL: 500ms
      WORKER_LEASE: 30s
      WORKER_OPERATION_TIMEOUT: 10s
      WORKER_RETRY_BASE: 1s
      WORKER_RETRY_CAP: 60s
      REFERENCE_TTL: 15m
      OBSERVABILITY_ENABLED: 'false'
      GORACE: halt_on_error=1 exitcode=66
      PROBE_DIRECTORY: /control/current
      PROBE_INSTANCE: fault
      PROBE_POINT: after-send
      PROBE_ROLE: publisher
    volumes:
    - publisher_credentials:/credentials:ro
    - recovery_control:/control
    depends_on:
      postgres:
        condition: service_healthy
      publisher-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 20s
    restart: 'no'
    entrypoint:
    - /out/crashprobe
  fault-reference:
    build:
      context: .
      dockerfile: Dockerfile.recovery
    image: go-wagering-service:recovery-race
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgres://wagering_app:wagering_app_local@postgres:5432/wagering?sslmode=disable
      AWS_REGION: us-east-1
      SQS_ENDPOINT: http://ministack:4566
      SQS_EVENTS_QUEUE_URL: http://ministack:4566/000000000000/wager-events.fifo
      SQS_PUBLISHER_CREDENTIALS_FILE: /credentials/publisher.json
      WORKER_POLL_INTERVAL: 500ms
      WORKER_LEASE: 30s
      WORKER_OPERATION_TIMEOUT: 10s
      WORKER_RETRY_BASE: 1s
      WORKER_RETRY_CAP: 60s
      REFERENCE_TTL: 15m
      OBSERVABILITY_ENABLED: 'false'
      GORACE: halt_on_error=1 exitcode=66
      PROBE_DIRECTORY: /control/current
      PROBE_INSTANCE: fault
      PROBE_POINT: after-reference-claim
      PROBE_ROLE: publisher
    volumes:
    - publisher_credentials:/credentials:ro
    - recovery_control:/control
    depends_on:
      postgres:
        condition: service_healthy
      publisher-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 20s
    restart: 'no'
    entrypoint:
    - /out/crashprobe
  fault-consumer:
    build:
      context: .
      dockerfile: Dockerfile.recovery
    image: go-wagering-service:recovery-race
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgres://wagering_app:wagering_app_local@postgres:5432/wagering?sslmode=disable
      AWS_REGION: us-east-1
      SQS_ENDPOINT: http://ministack:4566
      SQS_INPUT_QUEUE_URL: http://ministack:4566/000000000000/wager-transactions.fifo
      SQS_CONSUMER_CREDENTIALS_FILE: /credentials/consumer.json
      SQS_ALLOWED_PROVIDERS: provider-a,provider-b
      OBSERVABILITY_ENABLED: 'false'
      GORACE: halt_on_error=1 exitcode=66
      PROBE_DIRECTORY: /control/current
      PROBE_INSTANCE: fault
      PROBE_POINT: before-delete
      PROBE_ROLE: consumer
    volumes:
    - consumer_credentials:/credentials:ro
    - recovery_control:/control
    depends_on:
      postgres:
        condition: service_healthy
      ingress-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 20s
    restart: 'no'
    entrypoint:
    - /out/crashprobe
  recovery-a:
    build:
      context: .
      dockerfile: Dockerfile.recovery
    image: go-wagering-service:recovery-race
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgres://wagering_app:wagering_app_local@postgres:5432/wagering?sslmode=disable
      AWS_REGION: us-east-1
      SQS_ENDPOINT: http://ministack:4566
      SQS_EVENTS_QUEUE_URL: http://ministack:4566/000000000000/wager-events.fifo
      SQS_PUBLISHER_CREDENTIALS_FILE: /credentials/publisher.json
      WORKER_POLL_INTERVAL: 500ms
      WORKER_LEASE: 30s
      WORKER_OPERATION_TIMEOUT: 10s
      WORKER_RETRY_BASE: 1s
      WORKER_RETRY_CAP: 60s
      REFERENCE_TTL: 15m
      OBSERVABILITY_ENABLED: 'false'
      GORACE: halt_on_error=1 exitcode=66
      PROBE_DIRECTORY: /control/current
      PROBE_INSTANCE: recovery-a
      PROBE_POINT: observe
      PROBE_ROLE: publisher
    volumes:
    - publisher_credentials:/credentials:ro
    - recovery_control:/control
    depends_on:
      postgres:
        condition: service_healthy
      publisher-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 20s
    restart: 'no'
    entrypoint:
    - /out/crashprobe
  recovery-b:
    build:
      context: .
      dockerfile: Dockerfile.recovery
    image: go-wagering-service:recovery-race
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgres://wagering_app:wagering_app_local@postgres:5432/wagering?sslmode=disable
      AWS_REGION: us-east-1
      SQS_ENDPOINT: http://ministack:4566
      SQS_EVENTS_QUEUE_URL: http://ministack:4566/000000000000/wager-events.fifo
      SQS_PUBLISHER_CREDENTIALS_FILE: /credentials/publisher.json
      WORKER_POLL_INTERVAL: 500ms
      WORKER_LEASE: 30s
      WORKER_OPERATION_TIMEOUT: 10s
      WORKER_RETRY_BASE: 1s
      WORKER_RETRY_CAP: 60s
      REFERENCE_TTL: 15m
      OBSERVABILITY_ENABLED: 'false'
      GORACE: halt_on_error=1 exitcode=66
      PROBE_DIRECTORY: /control/current
      PROBE_INSTANCE: recovery-b
      PROBE_POINT: observe
      PROBE_ROLE: publisher
    volumes:
    - publisher_credentials:/credentials:ro
    - recovery_control:/control
    depends_on:
      postgres:
        condition: service_healthy
      publisher-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 20s
    restart: 'no'
    entrypoint:
    - /out/crashprobe
  recovery-consumer:
    build:
      context: .
      dockerfile: Dockerfile.recovery
    image: go-wagering-service:recovery-race
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgres://wagering_app:wagering_app_local@postgres:5432/wagering?sslmode=disable
      AWS_REGION: us-east-1
      SQS_ENDPOINT: http://ministack:4566
      SQS_INPUT_QUEUE_URL: http://ministack:4566/000000000000/wager-transactions.fifo
      SQS_CONSUMER_CREDENTIALS_FILE: /credentials/consumer.json
      SQS_ALLOWED_PROVIDERS: provider-a,provider-b
      OBSERVABILITY_ENABLED: 'false'
      GORACE: halt_on_error=1 exitcode=66
      PROBE_DIRECTORY: /control/current
      PROBE_INSTANCE: recovery-consumer
      PROBE_POINT: observe
      PROBE_ROLE: consumer
    volumes:
    - consumer_credentials:/credentials:ro
    - recovery_control:/control
    depends_on:
      postgres:
        condition: service_healthy
      ingress-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 20s
    restart: 'no'
    entrypoint:
    - /out/crashprobe
  recovery-observer:
    image: ministackorg/ministack:1.5.21
    entrypoint:
    - python
    - /recovery/observe.py
    environment:
      API_URLS: http://api-1:8080,http://api-1:8080,http://api-1:8080
      KEYCLOAK_TOKEN_URL: http://keycloak:8080/realms/wagering/protocol/openid-connect/token
      WALLET_CLIENT_SECRET: ${WALLET_CLIENT_SECRET:-wallet-service-local-secret}
      PROVIDER_A_CLIENT_SECRET: ${PROVIDER_A_CLIENT_SECRET:-provider-a-local-secret}
      AWS_ENDPOINT_URL: http://ministack:4566
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${SQS_ADMIN_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${SQS_ADMIN_SECRET_ACCESS_KEY:-sqs_admin_local}
      AWS_EC2_METADATA_DISABLED: 'true'
      SQS_INPUT_QUEUE_URL: http://ministack:4566/000000000000/wager-transactions.fifo
      SQS_OUTPUT_QUEUE_URL: http://ministack:4566/000000000000/wager-events.fifo
    volumes:
    - ./deploy/recovery:/recovery:ro
    - ./deploy/distributed:/distributed:ro
    - ./deploy/sqs:/scripts:ro
    - producer_credentials:/credentials:ro
    - recovery_control:/control
  recovery-sql:
    image: postgres:17.11-bookworm
    entrypoint:
    - psql
    - -h
    - postgres
    - -U
    - postgres
    - -d
    - wagering
    - -v
    - ON_ERROR_STOP=1
    environment:
      PGPASSWORD: ${POSTGRES_ADMIN_PASSWORD:-postgres_local}
    volumes:
    - ./deploy/distributed:/audit:ro
    - recovery_control:/control:ro
volumes:
  postgres_data: null
  ministack_data: null
  publisher_credentials: null
  consumer_credentials: null
  producer_credentials: null
  recovery_control: null
